name: Build Windows WebRTC AEC3
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-webrtc-aec3.yml'
      - 'desktop-companion/native/**'
  pull_request:
    paths:
      - '.github/workflows/build-webrtc-aec3.yml'
      - 'desktop-companion/native/**'

permissions:
  contents: read

jobs:
  windows-aec3:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Prepare depot_tools
        shell: pwsh
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$env:RUNNER_TEMP\depot_tools"
          "$env:RUNNER_TEMP\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          'DEPOT_TOOLS_WIN_TOOLCHAIN=0' | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Checkout WebRTC and dependencies
        shell: cmd
        working-directory: ${{ runner.temp }}
        run: |
          call fetch --nohooks webrtc
          cd src
          call gclient sync --no-history
      - name: Build native adapter
        shell: cmd
        run: |
          xcopy /E /I /Y desktop-companion\native "%RUNNER_TEMP%\src\mark_apm"
          cd /d "%RUNNER_TEMP%\src"
          call gn gen out\mark_aec3 --args="is_debug=false is_component_build=false target_cpu=\"x64\" rtc_include_tests=false"
          if errorlevel 1 exit /b 1
          call autoninja -C out\mark_aec3 mark_apm:mark_webrtc_apm
      - name: Package binary and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $dll = Get-ChildItem "$env:RUNNER_TEMP\src\out\mark_aec3" -Filter 'mark_webrtc_apm.dll' -Recurse | Select-Object -First 1
          if (-not $dll) { throw 'Native DLL not produced' }
          Copy-Item $dll.FullName dist/mark_webrtc_apm.dll
          $hash = (Get-FileHash dist/mark_webrtc_apm.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  mark_webrtc_apm.dll" | Set-Content dist/SHA256SUMS
          @{windows_x64_sha256=$hash; source_revision=(git -C "$env:RUNNER_TEMP\src" rev-parse HEAD)} | ConvertTo-Json | Set-Content dist/build-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: mark-webrtc-aec3-windows-x64
          path: dist/
          if-no-files-found: error
