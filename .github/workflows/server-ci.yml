name: Mark-LIV Server CI

on:
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/server-ci.yml'
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/server-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest 'cryptography>=42,<50'
      - name: Compile Python sources
        run: python -m compileall -q actions core dashboard main.py memory plugins
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests
