<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JARVIS Device Pairing</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#07090f;--surface:rgba(255,255,255,.04);--border:rgba(255,255,255,.07);--accent:#6366f1;--adim:rgba(99,102,241,.14);--text:#dde3ed;--muted:#5e6a7e;--green:#22c55e;--gdim:rgba(34,197,94,.14);--red:#f87171}html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:rgba(7,9,15,.95)}.logo{font-size:15px;font-weight:700;letter-spacing:6px}.logo em{color:var(--accent);font-style:normal}.pill{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--muted)}.dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}.spacer{flex:1}.url{font-size:10px;font-family:monospace;color:var(--muted);padding:4px 9px;background:var(--surface);border:1px solid var(--border);border-radius:6px}main{flex:1;display:grid;place-items:center;padding:24px}.card{width:min(92vw,480px);padding:26px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}h1{font-size:18px;letter-spacing:2px;margin-bottom:8px}.sub{color:var(--muted);font-size:13px;line-height:1.55;margin-bottom:18px}.status{padding:11px 13px;border:1px solid var(--border);background:var(--bg);border-radius:10px;color:var(--muted);font-size:13px;margin-bottom:12px}.status.ok{color:var(--green);border-color:rgba(34,197,94,.3);background:var(--gdim)}.status.bad{color:var(--red);border-color:rgba(248,113,113,.3)}input,button{width:100%;padding:12px 14px;border-radius:11px;font-size:14px}input{background:var(--bg);border:1.5px solid var(--border);color:var(--text);outline:none;text-transform:uppercase;letter-spacing:3px;text-align:center;font-weight:700;margin-bottom:9px}input:focus{border-color:var(--accent)}button{border:none;background:var(--accent);color:#fff;font-size:11px;font-weight:700;letter-spacing:1.5px;cursor:pointer;margin-top:8px}button.secondary{background:var(--surface);border:1px solid var(--border);color:var(--text)}button:disabled{opacity:.4;cursor:not-allowed}#cmd{display:none;margin-top:16px;border-top:1px solid var(--border);padding-top:16px}#cmd input{text-transform:none;letter-spacing:0;text-align:left;font-weight:400}.note{margin-top:16px;color:var(--muted);font-size:11px;line-height:1.55}
</style></head><body><header><div class="logo"><em>J</em>ARVIS</div><div class="pill"><span class="dot"></span>DEVICE PAIRING</div><div class="spacer"></div><div class="url" id="host"></div></header>
<main><section class="card"><h1>TRUSTED DEVICE</h1><p class="sub">Pair this browser once. Its cryptographic identity remains trusted until the device is revoked in JARVIS.</p><div id="status" class="status">Preparing secure device identity…</div><input id="code" maxlength="6" autocomplete="one-time-code" placeholder="PAIR CODE"><button id="pair" disabled>PAIR THIS DEVICE</button><button id="native" class="secondary" style="display:none">OPEN JARVIS COMPANION</button><div id="cmd"><input id="text" placeholder="Send a command to JARVIS…"><button id="send">SEND COMMAND</button></div><p class="note">Pair Code is used only for first-time trust. Clearing browser site data removes this browser's private device key.</p></section></main>
<script>
const qs=new URLSearchParams(location.search),st=document.querySelector('#status'),btn=document.querySelector('#pair'),nativeBtn=document.querySelector('#native'),cmd=document.querySelector('#cmd'),codeInput=document.querySelector('#code');document.querySelector('#host').textContent=location.host;codeInput.value=(qs.get('code')||'').toUpperCase();let offer,keys,ws;
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replaceAll('+','-').replaceAll('/','_').replaceAll('=',''),unb64=s=>Uint8Array.from(atob(s.replaceAll('-','+').replaceAll('_','/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
async function identity(){let j=localStorage.getItem('jarvis_mesh_identity');if(j)return JSON.parse(j);let kp=await crypto.subtle.generateKey({name:'Ed25519'},true,['sign','verify']);let d={device_id:crypto.randomUUID(),name:navigator.userAgent.includes('Android')?'Android Browser':'Browser Device',public_key:b64(await crypto.subtle.exportKey('raw',kp.publicKey)),private_key:b64(await crypto.subtle.exportKey('pkcs8',kp.privateKey))};localStorage.setItem('jarvis_mesh_identity',JSON.stringify(d));return d}
async function sign(txt){let k=await crypto.subtle.importKey('pkcs8',unb64(keys.private_key),{name:'Ed25519'},false,['sign']);return b64(await crypto.subtle.sign('Ed25519',k,new TextEncoder().encode(txt)))}
function setStatus(t,c=''){st.className='status '+c;st.textContent=t}
async function connect(){let proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(`${proto}//${location.host}/ws/device?device_id=${encodeURIComponent(keys.device_id)}`);ws.onmessage=async e=>{let m=JSON.parse(e.data);if(m.type==='challenge')ws.send(JSON.stringify({type:'proof',signature:await sign(m.challenge)}));if(m.type==='ready'){setStatus('Paired and connected to JARVIS.','ok');codeInput.style.display='none';btn.style.display='none';nativeBtn.style.display='none';cmd.style.display='block'}if(m.type==='capability.call'){let result={ok:false,error:'unsupported browser capability'};try{if(m.capability==='notification'){new Notification(String(m.args?.text||'JARVIS'));result={ok:true}}else if(m.capability==='vibration'){navigator.vibrate(Number(m.args?.ms||300));result={ok:true}}else if(m.capability==='clipboard.write'){await navigator.clipboard.writeText(String(m.args?.text||''));result={ok:true}}else if(m.capability==='open_url'){window.open(String(m.args?.url||''),'_blank');result={ok:true}}}catch(x){result={ok:false,error:String(x)}}ws.send(JSON.stringify({type:'capability.result',call_id:m.call_id,...result}))}};ws.onclose=e=>{if(e.code===4001||e.code===4003){setStatus('Device is no longer trusted. Enter a new Pair Code.','bad');codeInput.style.display='block';btn.style.display='block'}else setStatus('Disconnected. Reload to reconnect.','bad')}}
async function loadOffer(){let code=codeInput.value.trim().toUpperCase();if(code.length!==6){setStatus('Enter the 6-character Pair Code shown by JARVIS.');btn.disabled=true;nativeBtn.style.display='none';return}setStatus('Checking Pair Code…');let r=await fetch('/api/pairing/offer/'+encodeURIComponent(code));if(!r.ok){setStatus('Pairing code invalid or expired.','bad');btn.disabled=true;nativeBtn.style.display='none';return}offer=await r.json();setStatus(`Ready to pair with ${offer.name}.`);btn.disabled=false;nativeBtn.style.display='block'}
(async()=>{try{keys=await identity();let known=await fetch('/api/device-known/'+encodeURIComponent(keys.device_id)).then(r=>r.json()).catch(()=>({known:false}));if(known.known){setStatus('Known device — reconnecting securely…');codeInput.style.display='none';btn.style.display='none';await connect();return}if(codeInput.value.length===6)await loadOffer();else setStatus('Enter the Pair Code shown by JARVIS.')}catch(e){setStatus(String(e),'bad')}})();
codeInput.addEventListener('input',()=>{codeInput.value=codeInput.value.toUpperCase().replace(/[^A-Z2-9]/g,'').slice(0,6);if(codeInput.value.length===6)loadOffer();else{btn.disabled=true;nativeBtn.style.display='none'}});
btn.onclick=async()=>{btn.disabled=true;try{let code=codeInput.value.trim().toUpperCase();if(!offer||offer.code!==code)await loadOffer();let sig=await sign(offer.nonce+':'+code),capabilities=['jarvis.command','notification','vibration','clipboard.write','open_url'];let r=await fetch('/api/pairing/accept',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code,peer:{device_id:keys.device_id,name:keys.name,public_key:keys.public_key},signature:sig,capabilities})}),j=await r.json();if(!j.ok)throw Error(j.error||'Pair failed');await connect()}catch(e){setStatus(String(e),'bad');btn.disabled=false}};
nativeBtn.onclick=()=>{let code=codeInput.value.trim().toUpperCase();location.href='jarvis://pair?code='+encodeURIComponent(code)};
document.querySelector('#send').onclick=()=>{let t=document.querySelector('#text');if(ws?.readyState===1&&t.value.trim()){ws.send(JSON.stringify({type:'jarvis.command',text:t.value.trim()}));t.value=''}};
</script></body></html>
