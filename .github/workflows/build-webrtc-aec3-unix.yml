name: Build Unix WebRTC AEC3
# Optional native AEC3 build: manual only. Normal pushes must not fetch Chromium.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build only the selected failing platform; all is explicit'
        required: true
        type: choice
        default: linux-arm64
        options:
          - linux-arm64
          - linux-armhf
          - macos-arm64
          - macos-x64
          - linux-x64
          - all
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
            extension: so
          - os: ubuntu-22.04
            label: linux-arm64
            extension: so
            target_cpu: arm64
          - os: ubuntu-22.04
            label: linux-armhf
            extension: so
            target_cpu: arm
          - os: macos-15
            label: macos-arm64
            extension: dylib
          - os: macos-15-intel
            label: macos-x64
            extension: dylib
    if: ${{ inputs.target == 'all' || inputs.target == matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 clang lld ninja-build pkg-config
      - name: Checkout WebRTC
        shell: bash
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"
      - name: Sync source
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/depot_tools:$PATH"
          cd "$RUNNER_TEMP"
          # Retry from a clean checkout after transient Chromium Git HTTP 503s.
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/src" "$RUNNER_TEMP/.gclient" "$RUNNER_TEMP/.gclient_entries" "$RUNNER_TEMP/_bad_scm"
            if fetch --nohooks webrtc && (cd src && gclient sync --no-history --nohooks --jobs=2); then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::WebRTC source sync failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 30))
          done
      - name: Install Linux target sysroot
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/depot_tools:$PATH"
          cd "$RUNNER_TEMP/src"
          case "${{ matrix.label }}" in
            linux-x64)  arch=amd64 ;;
            linux-arm64) arch=arm64 ;;
            linux-armhf) arch=arm ;;
            *) echo "::error::Unsupported Linux target"; exit 1 ;;
          esac
          # ARM cross-builds also compile host-side tools for amd64.
          python3 build/linux/sysroot_scripts/install-sysroot.py --arch=amd64
          if [ "$arch" != amd64 ]; then
            python3 build/linux/sysroot_scripts/install-sysroot.py --arch="$arch"
          fi
      - name: Compile AEC3
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/depot_tools:$PATH"
          cp -R desktop-companion/native "$RUNNER_TEMP/src/mark_apm"
          cd "$RUNNER_TEMP/src"
          mkdir -p out/mark_aec3
          cat > out/mark_aec3/args.gn <<'EOF'
          is_debug = false
          is_component_build = false
          rtc_include_tests = false

          EOF
          if [ -n "${{ matrix.target_cpu }}" ]; then
            echo 'target_cpu = "${{ matrix.target_cpu }}"' >> out/mark_aec3/args.gn
          fi
          cat >> BUILD.gn <<'EOF'

          group("mark_apm_build") {
            deps = [ "//mark_apm:mark_webrtc_apm" ]
          }
          EOF
          gn gen out/mark_aec3
          autoninja -C out/mark_aec3 mark_apm_build
      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          binary="$(find "$RUNNER_TEMP/src/out/mark_aec3" -name '*mark_webrtc_apm*.${{ matrix.extension }}' -type f | head -n 1)"
          test -n "$binary"
          cp "$binary" "dist/libmark_webrtc_apm.${{ matrix.extension }}"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum *.${{ matrix.extension }} > SHA256SUMS; else shasum -a 256 *.${{ matrix.extension }} > SHA256SUMS; fi
          git -C "$RUNNER_TEMP/src" rev-parse HEAD > WEBRTC_REVISION
      - uses: actions/upload-artifact@v4
        with:
          name: mark-aec3-${{ matrix.label }}
          path: dist/
          if-no-files-found: error
