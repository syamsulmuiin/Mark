name: Build Windows WebRTC AEC3
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-webrtc-aec3.yml'
      - 'desktop-companion/native/**'
  pull_request:
    paths:
      - '.github/workflows/build-webrtc-aec3.yml'
      - 'desktop-companion/native/**'
permissions:
  contents: read
jobs:
  windows-aec3:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Prepare depot_tools
        shell: pwsh
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$env:RUNNER_TEMP/depot_tools"
          "$env:RUNNER_TEMP/depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          'DEPOT_TOOLS_WIN_TOOLCHAIN=0' | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Checkout WebRTC
        shell: cmd
        working-directory: ${{ runner.temp }}
        run: |
          call fetch --nohooks webrtc
          if errorlevel 1 exit /b 1
          cd src
          call gclient sync --no-history
          if errorlevel 1 exit /b 1
      - name: Build native adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Include'
          $installed = @(Get-ChildItem $sdkRoot -Directory | Where-Object { (Test-Path (Join-Path $_.FullName 'um')) -and (Test-Path (Join-Path $_.FullName 'ucrt')) } | Sort-Object { [version]$_.Name } -Descending)
          if ($installed.Count -eq 0) { throw 'No complete Windows SDK found' }
          $sdk = $installed[0].Name
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = (& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1)
          if (-not $vs) { throw 'Visual Studio not found' }
          $devcmd = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          $batch = Join-Path $env:RUNNER_TEMP 'mark-init-vs.cmd'
          "@echo off`r`ncall `"$devcmd`" -arch=x64 -host_arch=x64 -winsdk=$sdk`r`nif errorlevel 1 exit /b 1`r`nset" | Set-Content $batch -Encoding ascii
          $envLines = & cmd.exe /d /c $batch
          if ($LASTEXITCODE -ne 0) { throw 'VsDevCmd failed' }
          foreach ($line in $envLines) {
            if ($line -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          $env:WindowsSDKVersion = "$sdk\"
          $env:UCRTVersion = $sdk
          $env:WindowsSdkDir = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/'
          $env:WindowsSDKLibVersion = "$sdk\"
          $env:UniversalCRTSdkDir = $env:WindowsSdkDir
          $env:WindowsSdkVerBinPath = Join-Path $env:WindowsSdkDir "bin/$sdk/"
          $sdkInclude = Join-Path $env:WindowsSdkDir "Include/$sdk"
          $sdkLib = Join-Path $env:WindowsSdkDir "Lib/$sdk"
          foreach ($sub in @('um','ucrt','shared','winrt')) {
            if (-not (Test-Path (Join-Path $sdkInclude $sub))) { throw "Incomplete SDK include: $sub" }
          }
          foreach ($sub in @('um/x64','ucrt/x64')) {
            if (-not (Test-Path (Join-Path $sdkLib $sub))) { throw "Incomplete SDK library: $sub" }
          }
          $existingInclude = @($env:INCLUDE -split ';' | Where-Object { $_ -and ($_ -notmatch 'Windows Kits[/\\]10[/\\]include') })
          $existingLib = @($env:LIB -split ';' | Where-Object { $_ -and ($_ -notmatch 'Windows Kits[/\\]10[/\\]lib') })
          $env:INCLUDE = (((@('ucrt','shared','um','winrt') | ForEach-Object { Join-Path $sdkInclude $_ }) + $existingInclude) -join ';')
          $env:LIB = (((@('ucrt/x64','um/x64') | ForEach-Object { Join-Path $sdkLib $_ }) + $existingLib) -join ';')
          Write-Host "Detected SDK $sdk with Visual Studio toolchain"
          Write-Host "SDK include directory: $sdkInclude"
          Copy-Item -Path 'desktop-companion/native' -Destination "$env:RUNNER_TEMP/src/mark_apm" -Recurse -Force
          Set-Location "$env:RUNNER_TEMP/src"
          Add-Content -Path BUILD.gn -Value @'

          group("mark_apm_build") {
            deps = [ "//mark_apm:mark_webrtc_apm" ]
          }
          '@
          New-Item -ItemType Directory -Force -Path out/mark_aec3 | Out-Null
          @(
            'is_debug = false'
            'is_component_build = false'
            'target_cpu = "x64"'
            'rtc_include_tests = false'
            "windows_sdk_version = `"$sdk`""
          ) | Set-Content out/mark_aec3/args.gn -Encoding ascii
          & gn gen out/mark_aec3
          if ($LASTEXITCODE -ne 0) { throw "gn gen failed ($LASTEXITCODE)" }
          & autoninja -C out/mark_aec3 mark_apm_build
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }
      - name: Package binary and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $dll = Get-ChildItem "$env:RUNNER_TEMP/src/out/mark_aec3" -Filter mark_webrtc_apm.dll -Recurse | Select-Object -First 1
          if (-not $dll) { throw 'Native DLL not produced' }
          Copy-Item $dll.FullName dist/mark_webrtc_apm.dll
          $hash = (Get-FileHash dist/mark_webrtc_apm.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  mark_webrtc_apm.dll" | Set-Content dist/SHA256SUMS
          git -C "$env:RUNNER_TEMP/src" rev-parse HEAD | Set-Content dist/WEBRTC_REVISION
      - uses: actions/upload-artifact@v4
        with:
          name: mark-webrtc-aec3-windows-x64
          path: dist/
          if-no-files-found: error
