name: Mark Server CI

on:
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/server-ci.yml'
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/server-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and compile check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest 'ruff<1' 'cryptography>=42,<50' 'numpy>=1.24,<3' 'websockets>=14,<17'
      - name: Check undefined names and redefinitions
        run: ruff check --select F821,F822,F823,F811 --exclude pytest-of-root .
      - name: Compile Python sources
        run: python -m compileall -q actions core dashboard main.py memory plugins desktop-companion setup.py
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests
